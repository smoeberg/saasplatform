# Prometheus Helm values for saasplatform
# kube-prometheus-stack configuration

# Global configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Prometheus configuration
prometheus:
  enabled: true
  
  # Service configuration
  service:
    type: ClusterIP
    port: 9090
    targetPort: 9090
    annotations: {}
    labels: {}
  
  # Ingress configuration
  ingress:
    enabled: false
    hosts: []
    annotations: {}
  
  # Service account
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: true
  
  # Service monitor
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    selfMonitor: true
  
  # Pod monitor
  podMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  
  # Probe
  probe:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

  # Prometheus server configuration
  server:
    enabled: true
    replicaCount: 1
    
    # Resource configuration
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    
    # Node selector
    nodeSelector: {}
    
    # Tolerations
    tolerations: []
    
    # Affinity
    affinity: {}
    
    # Persistence
    persistentVolume:
      enabled: true
      size: 50Gi
      storageClass: "local-path"
      accessModes:
        - ReadWriteOnce
      finalizers:
        - kubernetes.io/pvc-protection
    
    # Retention
    retention: 30d
    retentionSize: "50GB"
    
    # Log level
    logLevel: info
    
    # Pod configuration
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      labels: {}
      annotations: {}
    
    # Priority class
    priorityClassName: ""
    
    # Additional volumes
    additionalVolumes: []
    
    # Additional volume mounts
    additionalVolumeMounts: []

  # Alertmanager configuration
  alertmanager:
    enabled: true
    replicaCount: 1
    
    # Resource configuration
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    
    # Node selector
    nodeSelector: {}
    
    # Tolerations
    tolerations: []
    
    # Affinity
    affinity: {}
    
    # Persistence
    persistentVolume:
      enabled: true
      size: 10Gi
      storageClass: "local-path"
      accessModes:
        - ReadWriteOnce
    
    # Pod configuration
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

  # Node exporter configuration
  nodeExporter:
    enabled: true
    
    # Resource configuration
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    
    # Node selector
    nodeSelector: {}
    
    # Tolerations
    tolerations: []
    
    # Affinity
    affinity: {}
    
    # Pod configuration
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

  # kube-state-metrics configuration
  kubeStateMetrics:
    enabled: true
    
    # Resource configuration
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
    
    # Node selector
    nodeSelector: {}
    
    # Tolerations
    tolerations: []
    
    # Affinity
    affinity: {}
    
    # Pod configuration
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000

  # kubelet service monitor
  kubelet:
    enabled: true
    namespace: kube-system
    
    # Resource configuration
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

  # API server service monitor
  kubeApiServer:
    enabled: true
    tlsConfig:
      serverName: kubernetes
      insecureSkipVerify: true

  # CoreDNS service monitor
  coreDns:
    enabled: true
    namespace: kube-system

  # kubeControllerManager service monitor
  kubeControllerManager:
    enabled: true
    namespace: kube-system

  # kubeScheduler service monitor
  kubeScheduler:
    enabled: true
    namespace: kube-system

  # kubeEtcd service monitor
  kubeEtcd:
    enabled: true
    namespace: kube-system
    service:
      enabled: true
      port: 2379
      targetPort: 2379
    
    # TLS configuration
    tlsConfig:
      serverName: kubernetes
      insecureSkipVerify: true

  # Additional service monitors
  additionalServiceMonitors: []

# Grafana configuration (disabled - installed separately)
grafana:
  enabled: false

# Alertmanager configuration
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    
    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      receiver: 'null'
    
    receivers:
    - name: 'null'

# Additional scrape configs
additionalScrapeConfigs: []
