apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: letsencrypt-prod
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    
    # Email address used for ACME registration
    email: admin@saasplatform.dk
    
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-prod
      
    # Enable the HTTP-01 challenge provider
    solvers:
    - dns01:
        cloudflare:
          email: admin@saasplatform.dk
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
          zoneNameSelector:
            matchLabels:
              saasplatform.io/cloudflare-zone: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
  labels:
    app: cert-manager
    app.kubernetes.io/name: cert-manager
type: Opaque
data:
  api-token: ""  # Base64 encoded Cloudflare API token
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    name: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/instance: letsencrypt-staging
spec:
  acme:
    # The ACME server URL for staging
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    
    # Email address used for ACME registration
    email: admin@saasplatform.dk
    
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: letsencrypt-staging
      
    # Enable the HTTP-01 challenge provider
    solvers:
    - dns01:
        cloudflare:
          email: admin@saasplatform.dk
          apiTokenSecretRef:
            name: cloudflare-api-token-secret
            key: api-token
          zoneNameSelector:
            matchLabels:
              saasplatform.io/cloudflare-zone: "true"
