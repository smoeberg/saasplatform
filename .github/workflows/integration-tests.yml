name: integration-tests

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test-level:
        description: 'Test level (1=protocol, 2=integration)'
        required: true
        default: '2'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          cluster-name: saas-integration-test
          k3s-args: "--disable traefik"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq yq

      - name: Setup MinIO (S3 mock)
        run: |
          docker run -d -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --name minio \
            quay.io/minio/minio server /data --console-address ":9001"
          sleep 10
          # Opret buckets
          curl -X PUT http://localhost:9000/minioadmin/saasplatform-backups \
            -H "Host: localhost:9000" || true
          curl -X PUT http://localhost:9000/minioadmin/pre-migration-backups \
            -H "Host: localhost:9000" || true

      - name: Install cert-manager
        run: |
          kubectl create namespace cert-manager
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --version v1.14.4 \
            --set installCRDs=true

      - name: Install sealed-secrets
        run: |
          kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.22.0/controller.yaml

      - name: Run integration tests (niveau 2)
        if: inputs.test-level == '2' || inputs.test-level == ''
        env:
          S3_ENDPOINT: "http://localhost:9000"
          S3_BUCKET: "saasplatform-backups"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
        run: |
          # Vent på clusteret er klar
          sleep 10
          ./CI/run-tests.sh

      - name: Run protocol tests (niveau 1)
        if: inputs.test-level == '1'
        run: |
          # Kør kun protokol-tests (uden k3d)
          # For nu: kør det samme som integration-test
          ./CI/run-tests.sh || true

  canary-test:
    needs: integration-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          cluster-name: saas-canary-test
          k3s-args: "--disable traefik"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq yq

      - name: Setup MinIO
        run: |
          docker run -d -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --name minio \
            quay.io/minio/minio server /data --console-address ":9001"
          sleep 10
          curl -X PUT http://localhost:9000/minioadmin/saasplatform-backups \
            -H "Host: localhost:9000" || true

      - name: Install cert-manager
        run: |
          kubectl create namespace cert-manager
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --version v1.14.4 \
            --set installCRDs=true

      - name: Install sealed-secrets
        run: |
          kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.22.0/controller.yaml

      - name: Test canary-rollout
        env:
          S3_ENDPOINT: "http://localhost:9000"
          S3_BUCKET: "saasplatform-backups"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
          CANARY_PERCENTAGE: "10"
        run: |
          sleep 10
          
          # Deploy 5 test tenants
          for i in $(seq 1 5); do
            export SELLYOURSAAS_INSTANCE_NAME="canary-test-${i}"
            export SELLYOURSAAS_DOLIBARRINSTANCE_URL="https://canary-test-${i}.kunder.saasplatform.test"
            export SELLYOURSAAS_VERSION="23.0.1"
            ./Scripts/deploy.sh "canary-test-${i}" || true
          done
          
          sleep 30
          
          # Kør canary-rollout
          export SELLYOURSAAS_VERSION="23.0.2"
          export CANARY_PERCENTAGE="20"  # 20% af 5 = 1 tenant
          ./Scripts/canary-rollout.sh
          
          # Verificer canary-rollout
          # Tjek at 1 tenant er opdateret til 23.0.2
          UPDATED_COUNT=$(kubectl get pods -A -o json | \
            jq -r '[.items[] | select(.metadata.labels.app == "dolibarr") | .metadata.labels["pod-template-hash"]] | length' || echo 0)
          
          if [[ $UPDATED_COUNT -ge 1 ]]; then
            echo "✓ Canary-rollout test bestået"
          else
            echo "✗ Canary-rollout test fejlede"
            exit 1
          fi

  backup-test:
    needs: canary-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          cluster-name: saas-backup-test

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install Velero
        run: |
          # Installer Velero CLI
          wget https://github.com/vmware-tanzu/velero/releases/download/v1.12.0/velero-v1.12.0-linux-amd64.tar.gz
          tar -xvf velero-v1.12.0-linux-amd64.tar.gz
          sudo mv velero-v1.12.0-linux-amd64/velero /usr/local/bin/
          rm -rf velero-v1.12.0-linux-amd64 velero-v1.12.0-linux-amd64.tar.gz
          
          # Installer Velero i clusteret
          velero install \
            --provider aws \
            --plugins velero/velero-plugin-for-aws:v1.4.0 \
            --bucket saasplatform-backups \
            --backup-location-config region=us-east-1,s3ForcePathStyle=true,s3Url=http://localhost:9000 \
            --snapshot-location-config region=us-east-1 \
            --secret-file ./Infrastructure/velero/velero-credentials \
            --namespace velero \
            --wait || true

      - name: Setup MinIO
        run: |
          docker run -d -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --name minio \
            quay.io/minio/minio server /data
          sleep 5
          curl -X PUT http://localhost:9000/minioadmin/saasplatform-backups \
            -H "Host: localhost:9000" || true

      - name: Create test backup
        run: |
          # Deploy test tenant
          export SELLYOURSAAS_INSTANCE_NAME="backup-test-1"
          export SELLYOURSAAS_DOLIBARRINSTANCE_URL="https://backup-test-1.kunder.saasplatform.test"
          export SELLYOURSAAS_VERSION="23.0.1"
          ./Scripts/deploy.sh "backup-test-1" || true
          
          sleep 15
          
          # Tag backup
          velero backup create test-backup \
            --include-namespaces tenant-backup-test-1 \
            --wait \
            --timeout 5m || true
          
          # Verificer backup
          velero backup get test-backup
          
          # Tjek backup indhold
          velero backup describe test-backup

      - name: Test restore
        run: |
          # Slet tenant
          ./Scripts/undeploy.sh "backup-test-1" || true
          
          sleep 5
          
          # Restore
          velero restore create --from-backup test-backup \
            --wait \
            --timeout 10m || true
          
          # Verificer restore
          velero restore get test-backup-*
          
          # Tjek at tenant kører
          sleep 10
          kubectl get pods -n tenant-backup-test-1 || true
