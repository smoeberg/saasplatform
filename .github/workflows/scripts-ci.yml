name: scripts-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          k3d-name: saas-test
          k3s-args: "--disable=traefik@server:*"

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          # Install yq
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Setup S3 mock (adobe/s3mock)
        run: |
          # MinIO er ikke laengere offentligt tilgaengeligt (docker.io + quay.io kraever
          # login siden 2025) -- CI bruger adobe/s3mock som S3-API-mock i stedet.
          docker run -d -p 9000:9191 --name s3mock adobe/s3mock
          sleep 10

          # Opret buckets (s3mock understoetter standard S3 PutBucket)
          curl -sf -X PUT http://localhost:9000/saasplatform-backups
          curl -sf -X PUT http://localhost:9000/pre-migration-backups
          curl -sf -X PUT http://localhost:9000/pre-migration-backups

      - name: Run CI tests
        env:
          S3_ENDPOINT: "http://localhost:9000"
          S3_BUCKET: "saasplatform-backups"
          S3_ACCESS_KEY: "minioadmin"
          S3_SECRET_KEY: "minioadmin"
        run: |
          # Vent på clusteret er klar
          sleep 10
          ./CI/run-tests.sh
