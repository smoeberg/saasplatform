{{- /*
  Fallback: If SealedSecrets is not available, create regular Secret
  This is for development/testing only - production should use SealedSecrets
  (se README.md, "Aabne punkter" -- 01-sealedsecret-db.yaml er pt. et dokumentations-
  stub og renderer aldrig noget rigtigt).

  FIX (kritisk, 2 dele):
  1) stringData er allerede klartekst -- Kubernetes base64-encoder selv til .data.
     Det tidligere "| b64enc" betoed at appen laeste en base64-streng som sit
     password i stedet for det rigtige -- garanteret login-fejl mod DB'en.
  2) Denne Secret maa IKKE forsvinde ved suspension. Den var foer betinget af
     "not .Values.suspended", saa den blev SLETTET ved suspend og en NY (med nye
     tilfaeldige credentials) blev genereret ved unsuspend -- men MariaDB's data
     ligger uroert paa PVC'en med de GAMLE credentials i sin brugertabel. Resultatet
     var login-fejl efter hver eneste unsuspend. Secret'en lever nu ligesom PVC'en:
     uafhaengigt af suspended-flaget.
  3) randAlphaNum genererer nye vaerdier ved HVER "helm upgrade" (refresh/suspend/
     unsuspend kalder alle helm upgrade). Uden "lookup" ville credentials rotere ved
     hvert kald. Vi genbruger derfor eksisterende vaerdier hvis Secret'en allerede
     findes, og genererer kun nye ved allerfoerste install.
*/ -}}
{{- $secretName := "tenant-db" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
    saasplatform.io/secret-type: database
type: Opaque
stringData:
  username: {{ if $existing }}{{ index $existing.data "username" | b64dec | quote }}{{ else }}{{ randAlphaNum 16 | quote }}{{ end }}
  password: {{ if $existing }}{{ index $existing.data "password" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
  root_password: {{ if $existing }}{{ index $existing.data "root_password" | b64dec | quote }}{{ else }}{{ randAlphaNum 32 | quote }}{{ end }}
