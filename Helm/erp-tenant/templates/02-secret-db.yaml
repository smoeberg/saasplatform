{{- /*
  Fallback: If SealedSecrets is not available, create regular Secret
  This is for development/testing only - production should use SealedSecrets
*/ -}}
{{- if not .Values.suspended -}}
apiVersion: v1
kind: Secret
metadata:
  name: tenant-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
    saasplatform.io/secret-type: database
  annotations:
    sealedsecrets.bitnami.com/sealed-secret-name: tenant-db
    sealedsecrets.bitnami.com/sealed-secret-namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  {{- /* Generate random credentials if not provided */ -}}
  username: {{ randAlphaNum 16 | b64enc | quote }}
  password: {{ randAlphaNum 32 | b64enc | quote }}
  root_password: {{ randAlphaNum 32 | b64enc | quote }}
{{- end -}}
