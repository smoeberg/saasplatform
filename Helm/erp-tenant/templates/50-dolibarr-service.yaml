apiVersion: v1
kind: Service
metadata:
  name: dolibarr
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
spec:
  selector:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
  ports:
    - port: 80
      targetPort: 80
      name: http
