apiVersion: v1
kind: ConfigMap
metadata:
  name: dolibarr-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
  annotations:
    saasplatform.io/config-checksum: {{ randAlphaNum 16 | quote }}
data:
  conf.php: |
    <?php
    // Dolibarr configuration - auto-generated by saasplatform Helm chart
    // Instance: {{ .Values.instance | quote }}
    // Domain: {{ .Values.domain | quote }}
    // Version: {{ .Values.image.tag | quote }}
    
    // Database configuration
    $dolibarr_main_db_host = getenv('DOLI_DB_HOST');
    $dolibarr_main_db_name = getenv('DOLI_DB_NAME');
    $dolibarr_main_db_user = getenv('DOLI_DB_USER');
    $dolibarr_main_db_pass = getenv('DOLI_DB_PASSWORD');
    $dolibarr_main_db_port = 3306;
    $dolibarr_main_db_type = 'mysqli';
    
    // URL configuration
    $dolibarr_main_url_root = getenv('DOLI_URL_ROOT') ?: 'https://{{ .Values.domain }}';
    
    // Security settings
    $dolibarr_main_force_https = 1;
    $dolibarr_main_restrict_os_commands = 'chmod,chown';
    $dolibarr_main_use_javascript_ajax = 1;
    
    // Performance settings
    $dolibarr_main_cache = 'auto';
    $dolibarr_main_optimize_smarty_compile = 1;
    
    // Multi-tenant isolation
    $dolibarr_main_instance_unique_id = '{{ .Values.instance }}';
    
    // Mail settings
    $dolibarr_main_mail_smtps_host = getenv('SMTP_HOST') ?: '';
    $dolibarr_main_mail_smtps_port = getenv('SMTP_PORT') ?: 587;
    $dolibarr_main_mail_smtps_tls = getenv('SMTP_TLS') ?: 1;
    $dolibarr_main_mail_smtps_auth = getenv('SMTP_AUTH') ?: 1;
    $dolibarr_main_mail_smtps_user = getenv('SMTP_USER') ?: '';
    $dolibarr_main_mail_smtps_pass = getenv('SMTP_PASS') ?: '';
    $dolibarr_main_mail_from = getenv('MAIL_FROM') ?: 'noreply@{{ .Values.domain }}';
    
    // PHP settings
    ini_set('memory_limit', getenv('PHP_MEMORY_LIMIT') ?: '512M');
    ini_set('max_execution_time', getenv('PHP_MAX_EXECUTION_TIME') ?: 300);
    ini_set('max_input_vars', getenv('PHP_MAX_INPUT_VARS') ?: 5000);
    
    // Health check endpoint
    // This is handled by a separate lightweight endpoint in the container
    