{{- /* Backup CronJob - only when not suspended */ -}}
{{- if and .Values.backup.enabled (not .Values.suspended) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
    saasplatform.io/cronjob-type: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit | default 1 }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: dolibarr
            tenant: {{ .Values.instance | quote }}
            saasplatform.io/cronjob-type: backup
          annotations:
            saasplatform.io/backup-schedule: {{ .Values.backup.schedule | quote }}
        spec:
          {{- if .Values.imagePullSecrets.enabled }}
          imagePullSecrets:
            - name: {{ .Values.imagePullSecrets.name | quote }}
          {{- end }}
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                {{- toYaml .Values.dolibarr.securityContext | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  # Create backup directory
                  mkdir -p /backup
                  
                  # Database dump with single transaction for consistency
                  mysqldump -h mariadb.{{ .Release.Namespace }}.svc.cluster.local \
                    -u "$DOLI_DB_USER" \
                    -p"$DOLI_DB_PASSWORD" \
                    --single-transaction \
                    --quick \
                    --skip-add-drop-table \
                    dolibarr > /backup/backup-$(date +%Y%m%d%H%M%S).sql
                  
                  # Compress
                  gzip /backup/backup-$(date +%Y%m%d%H%M%S).sql
                  
                  # Generate filename
                  BACKUP_FILE=$(ls /backup/backup-*.sql.gz)
                  TIMESTAMP=$(date +%Y%m%d%H%M%S)
                  
                  # Upload to S3 if enabled
                  {{- if .Values.backup.s3Enabled }}
                  if [ -n "$S3_ENDPOINT" ] && [ -n "$S3_BUCKET" ]; then
                    curl -s -X PUT \
                      -T "$BACKUP_FILE" \
                      "${S3_ENDPOINT}/${S3_BUCKET}/{{ .Values.instance }}/backup-${TIMESTAMP}.sql.gz" \
                      -H "Host: {{ .Values.backup.bucket }}.${S3_ENDPOINT#*//}" \
                      -u "${S3_ACCESS_KEY}:${S3_SECRET_KEY}" || true
                  fi
                  {{- end }}
                  
                  # Cleanup old backups (retention)
                  find /backup -name "backup-*.sql.gz" -mtime +{{ .Values.backup.retentionDays }} -delete 2>/dev/null || true
                  
                  echo "Backup completed: $BACKUP_FILE"
              env:
                - name: DOLI_DB_HOST
                  value: "mariadb.{{ .Release.Namespace }}.svc.cluster.local"
                - name: DOLI_DB_NAME
                  value: dolibarr
                - name: DOLI_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: tenant-db
                      key: username
                - name: DOLI_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tenant-db
                      key: password
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: endpoint
                      optional: true
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: bucket
                      optional: true
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: accessKey
                      optional: true
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: secretKey
                      optional: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 1Gi
{{- end -}}

---
{{- /* Pre-migration snapshot CronJob - only when migration is enabled and not suspended */ -}}
{{- if and .Values.dolibarr.migration.enabled (not .Values.suspended) -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pre-migration-snapshot
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
    saasplatform.io/cronjob-type: pre-migration
  annotations:
    saasplatform.io/migration-from: {{ .Values.image.previousTag | quote }}
    saasplatform.io/migration-to: {{ .Values.image.tag | quote }}
spec:
  schedule: "{{ .Values.backup.preMigration.schedule | default "0 2 * * *" }}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: dolibarr
            tenant: {{ .Values.instance | quote }}
            saasplatform.io/cronjob-type: pre-migration
        spec:
          {{- if .Values.imagePullSecrets.enabled }}
          imagePullSecrets:
            - name: {{ .Values.imagePullSecrets.name | quote }}
          {{- end }}
          containers:
            - name: pre-migration
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                {{- toYaml .Values.dolibarr.securityContext | nindent 16 }}
              command:
                - /bin/sh
                - -c
                - |
                  # Create backup directory
                  mkdir -p /backup
                  
                  # Take consistent snapshot
                  mysqldump -h mariadb.{{ .Release.Namespace }}.svc.cluster.local \
                    -u "$DOLI_DB_USER" \
                    -p"$DOLI_DB_PASSWORD" \
                    --single-transaction \
                    --quick \
                    --skip-add-drop-table \
                    --routines \
                    --triggers \
                    --events \
                    dolibarr > /backup/pre-migration-{{ .Values.image.tag }}-$(date +%Y%m%d%H%M%S).sql
                  
                  gzip /backup/pre-migration-{{ .Values.image.tag }}-*.sql
                  
                  # Upload to S3
                  {{- if .Values.backup.preMigration.s3Enabled }}
                  BACKUP_FILE=$(ls /backup/pre-migration-*.sql.gz)
                  curl -s -X PUT \
                    -T "$BACKUP_FILE" \
                    "${S3_ENDPOINT}/{{ .Values.backup.preMigration.bucket }}/{{ .Values.instance }}/$(basename $BACKUP_FILE)" \
                    -H "Host: {{ .Values.backup.preMigration.bucket }}.${S3_ENDPOINT#*//}" \
                    -u "${S3_ACCESS_KEY}:${S3_SECRET_KEY}" || true
                  {{- end }}
                  
                  echo "Pre-migration snapshot completed"
              env:
                - name: DOLI_DB_HOST
                  value: "mariadb.{{ .Release.Namespace }}.svc.cluster.local"
                - name: DOLI_DB_NAME
                  value: dolibarr
                - name: DOLI_DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: tenant-db
                      key: username
                - name: DOLI_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tenant-db
                      key: password
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: endpoint
                      optional: true
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: accessKey
                      optional: true
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: tenant-s3
                      key: secretKey
                      optional: true
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir:
                sizeLimit: 1Gi
{{- end -}}
