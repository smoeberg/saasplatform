{{- /* S3/Wasabi credentials -- injiceres af SellYourSaaS-agenten eller
     leveres via --set s3.accessKey/--set s3.secretKey ved udrulning. KODEN
     laeser altid via secretKeyRef og laever i release-historik. */ -}}
{{- if or .Values.s3.accessKey .Values.s3.secretKey }}
apiVersion: v1
kind: Secret
metadata:
  name: tenant-s3
  namespace: {{ .Release.Namespace }}
  labels:
    app: dolibarr
    tenant: {{ .Values.instance | quote }}
    app.kubernetes.io/managed-by: saasplatform
    saasplatform.io/secret-type: s3
type: Opaque
stringData:
  accessKey: {{ .Values.s3.accessKey | default "" | quote }}
  secretKey: {{ .Values.s3.secretKey | default "" | quote }}
{{- end }}
