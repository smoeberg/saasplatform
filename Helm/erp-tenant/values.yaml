# Default values for erp-tenant
# This is the default configuration for a standard tenant

# Tenant identification
instance: ""
domain: ""

# Suspension state
suspended: false

# Dolibarr image
image:
  repository: ghcr.io/smoeberg/dolibarr
  tag: "23.0.1"
  # For rollback: previous version to restore
  previousTag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registry (GHCR)
imagePullSecrets:
  enabled: true
  name: "ghcr-pull-secret"

# Dolibarr configuration
dolibarr:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # Migration settings
  migration:
    enabled: false
    # Pre-migration snapshot tag (auto-generated)
    preMigrationSnapshot: ""
  # Security context -- OPDELT i pod- og container-niveau (FIX): capabilities,
  # allowPrivilegeEscalation og readOnlyRootFilesystem findes ikke i K8s'
  # PodSecurityContext-skema. At bruge samme bloek paa begge niveauer fik chartet
  # til at fejle skemavalidering ved "helm install"/"kubectl apply".
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Replica count (limited to 1 due to ReadWriteOnce PVC)
  replicaCount: 1

# MariaDB database
db:
  enabled: true
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Security context for MariaDB
  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: false  # MariaDB needs to write to /var/lib/mysql
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  # Pod security context
  podSecurityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch

# Ingress configuration
ingress:
  enabled: true
  className: traefik
  tls: true

# Backup configuration
backup:
  enabled: true
  # retentionDays: 7 (standard) / 30 (premium)
  retentionDays: 7
  schedule: "0 3 * * *"
  s3Enabled: false
  bucket: ""
  # Pre-migration snapshots stored separately
  preMigration:
    enabled: true
    s3Enabled: true
    bucket: "pre-migration-backups"

# Resource quota per tenant
quota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 4Gi
  pvc: "3"

# NetworkPolicy configuration
networkPolicy:
  defaultDeny: true
  # egress allowances (mail, DNS, updates)
  egressMail: true

# Rollback settings
rollback:
  enabled: false
  targetVersion: ""
  restoreFromSnapshot: ""

# Suspended page configuration
suspendedPage:
  enabled: true
  image: nginx:alpine
  port: 8080

# Autoscaling (udskudt i fase 1 -- ReplicaCount er låst til 1 pga. ReadWriteOnce PVC)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80

# S3/Wasabi-cred (egentlige hemmeligheder injiceres af SellYourSaaS-agenten som SealedSecret-env;
# disse felter er kun endpoint-adresse og fallback-cards, Arkitektur rev. 6 §3.6)
s3:
  endpoint: ""
  accessKey: ""
  secretKey: ""

# DB-bruger (oprettes af init; password kommer fra SealedSecret/Secret)
db:
  user: dolibarr
